<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}" dir="{{ or site.Language.Direction "ltr" }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body class="
    {{ if in (slice "people" "pseudonyms" "articles") .Type }}
      {{ if not .IsPage }}has-filters{{ else }}db{{ end }}
    {{ end }}
    {{ if eq .Section "map" }}has-filters{{ end }}
  ">
    {{ partial "header.html" . }}

    <main class="content {{ if and .IsPage (in (slice "people" "pseudonyms" "articles") .Type) }}scoop{{ end }} {{ if eq .Section "map" }}map{{ end }}">
      {{ block "main" . }}
        {{ .Content }}
      {{ end }}
    </main>

    {{ partial "footer.html" . }}
  </body>
</html>
