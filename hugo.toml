baseURL = 'https://brown-university-library.github.io/nq-proto/'
locale = 'en-us'
title = 'Lives and Pseudonyms of Contributors to *Notes and Queries*'
theme = 'brown-hugo-starter'
sectionPagesMenu = 'main'

[outputs]
  section = ['html', 'json', 'rss']

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
		footnote = true
    [markup.goldmark.renderer]
      unsafe = true

[security]
  allowContent = ['^text/markdown$', '^text/html$']

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[taxonomies]
  glossary = 'glossary'
  gender = 'gender'