baseURL = 'https://brown-university-library.github.io/nq-proto/'
locale = 'en-us'
title = 'Literary Men and General Readers 1849-1949: Lives and Pseudonyms of Contributors to *Notes and Queries*'
theme = 'brown-hugo-starter'
sectionPagesMenu = 'main'
copyright = "[Kenneth Haynes](https://vivo.brown.edu/display/khaynes) and [Center for Digital Scholarship](https://cds.library.brown.edu/), [Brown University Library](https://lib.brown.edu/)"

[outputs]
  section = ['html', 'json', 'rss']

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
		footnote = true
    [markup.goldmark.renderer]
      unsafe = true

[security]
  allowContent = ['^text/markdown$', '^text/html$']

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[taxonomies]
  glossary = 'glossary'
  gender = 'gender'